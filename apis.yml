name: Zugata
description: Zugata was a San Francisco-based continuous performance-management and peer-feedback
  SaaS company, backed by Canaan Partners and others. Its platform let employees give and
  receive real-time, skill-based feedback and driver-of-performance insights for coaching
  and reviews. Culture Amp acquired Zugata in 2019 and folded its peer-feedback capabilities
  into the Culture Amp employee-experience platform; the standalone Zugata product and website
  (zugata.com) have since been retired. The domain still resolves NS and Proofpoint MX records
  (email routing) but serves no website, developer portal, documentation, or public API. No API
  surface exists to enrich — this profile is retained as a historical portfolio-company record.
